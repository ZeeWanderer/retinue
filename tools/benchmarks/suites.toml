source = "crates/retinue-ui/tests/text_pipeline.rs"
adapter = "overlay"
raw = "text.json"
cases = ["shape-and-resolve", "native-repaint", "retained-replay", "retained-reuse", "retained-changing-replay", "retained-changing-reuse", "desktop-reuse", "overlay-reuse", "desktop-changing-reuse", "overlay-changing-reuse"]
workload = 3
fixtures = ["assets/fonts/roboto/*"]

[suite.text-layout]
