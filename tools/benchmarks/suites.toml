# Bump workload when scripted input, timing boundaries or case semantics change.
[suite.render-quality]
owner = "retinue-render"
package = "retinue-render"
target = ["--lib"]
test = "quality::benchmark::optimizer_quality_benchmark"
source = "crates/retinue-render/src/quality/benchmark.rs"
adapter = "quality"
raw = "quality.json"
cases = ["decorated-scroll", "stable-rows", "solid-scroll", "few-columns", "larger-pixels", "translucent-overlap", "sparse-updates", "short-lived", "cache-pressure"]
workload = 1
fixtures = ["crates/retinue-render/src/quality/scenarios.rs", "assets/fonts/roboto/*"]

[suite.wf-overlay]
owner = "wfcompanion"
package = "wfcompanion"
target = ["--bin", "wfcompanion"]
test = "presentation::renderer::tests::overlay_benchmark"
source = "apps/wfcompanion/src/presentation/renderer.rs"
adapter = "overlay"
raw = "warframe.json"
cases = ["loading-buffer-cycle", "static-frame-copy", "static-frame-copy-cpu", "scene-change"]
workload = 2
fixtures = ["apps/wfcompanion/src/presentation/relic/fixture.rs", "assets/fonts/roboto/*"]

[suite.poe2-overlay]
owner = "poe2companion"
package = "poe2companion"
target = ["--lib"]
test = "presentation::evaluate::panel::tests::overlay_benchmark"
source = "apps/poe2companion/src/presentation/evaluate/panel.rs"
adapter = "overlay"
raw = "poe2.json"
cases = ["warm-repaint", "hover", "hover-partial", "listing-scroll", "scale-change"]
workload = 1
fixtures = ["apps/poe2companion/tests/fixtures/evaluate-reference.json", "assets/fonts/roboto/*"]

[suite.gui-rails]
owner = "wfgui"
package = "wfgui"
target = ["--bin", "wfgui"]
test = "presentation::shell::benchmark::rail_animation_benchmark"
source = "apps/wfgui/src/presentation/shell/benchmark/mod.rs"
adapter = "gui"
raw = "gui.json"
workload = 1
fixtures = ["apps/wfgui/src/data/storage.rs", "apps/wfgui/src/data/foundry.rs", "apps/wfgui/src/presentation/fixtures.rs", "assets/fonts/roboto/*"]

[suite.poe2-drag]
owner = "poe2companion"
package = "poe2companion"
target = ["--lib"]
test = "presentation::evaluate::panel::movement_benchmark::window_drag_benchmark"
source = "apps/poe2companion/src/presentation/evaluate/panel/movement_benchmark.rs"
adapter = "overlay"
raw = "poe2-drag.json"
cases = ["window-drag-full", "window-drag", "window-drag-relocate", "window-drag-native", "window-drag-regions", "window-drag-cpu", "window-drag-cpu-parallel"]
workload = 4
fixtures = ["apps/poe2companion/tests/fixtures/evaluate-reference.json", "assets/fonts/roboto/*"]

[suite.gui-foundry]
owner = "wfgui"
package = "wfgui"
target = ["--bin", "wfgui"]
test = "presentation::foundry::tests::foundry_scroll_benchmark"
source = "apps/wfgui/src/presentation/foundry/tests.rs"
adapter = "foundry"
raw = "gui.json"
workload = 1
fixtures = ["apps/wfgui/src/data/storage.rs", "apps/wfgui/src/data/foundry.rs", "apps/wfgui/src/presentation/fixtures.rs", "assets/fonts/roboto/*"]

[suite.gui-relics]
owner = "wfgui"
package = "wfgui"
target = ["--bin", "wfgui"]
