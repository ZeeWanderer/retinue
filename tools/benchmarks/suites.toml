# Bump workload when scripted input, timing boundaries or case semantics change.
[suite.promotion-cost]
owner = "retinue-render"
package = "retinue-render"
target = ["--lib", "--features", "benchmark"]
test = "cost::tests::promotion_benchmark::promotion_cost_benchmark"
source = "crates/retinue-render/src/cost/tests/promotion_benchmark.rs"
adapter = "overlay"
raw = "promotion.json"
cases = ["solid-build", "solid-replay", "solid-blit", "rounded-build", "rounded-replay", "rounded-blit", "rounded-outline-build", "rounded-outline-replay", "rounded-outline-blit", "ring-build", "ring-replay", "ring-blit", "glow-build", "glow-replay", "glow-blit", "text-build", "text-replay", "text-blit", "mixed-build", "mixed-replay", "mixed-blit"]
workload = 3
fixtures = ["assets/fonts/roboto/*"]

[suite.text-pipeline]
owner = "retinue-ui"
package = "retinue-ui"
