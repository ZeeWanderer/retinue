[workspace]
resolver = "3"
members = [
    "apps/arccompanion",
    "apps/poe2companion",
    "apps/retinue-inspect",
    "apps/wfcompanion",
    "crates/retinue-client",
    "crates/retinue-native",
    "crates/retinue-warframe",
]
exclude = [".cache"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
