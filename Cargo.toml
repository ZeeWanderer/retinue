[workspace]
resolver = "3"
members = [
    "apps/arccompanion",
    "apps/poe2companion",
    "apps/retinue-inspect",
    "apps/wfcompanion",
    "apps/wfgui",
    "crates/retinue-client",
    "crates/retinue-protocol",
    "crates/retinue-native",
    "crates/retinue-ui",
    "crates/retinue-ui-macros",
    "crates/retinue-render",
    "crates/retinue-poe2",
    "crates/retinue-warframe",
]
exclude = [".cache"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.retinue-ui]
opt-level = 3

[profile.dev.package.retinue-render]
opt-level = 3

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
