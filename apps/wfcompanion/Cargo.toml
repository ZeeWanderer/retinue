[package]
name = "wfcompanion"
# Cargo requires a literal; build.rs verifies it against ../../VERSION.
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Linux/Proton Warframe observer and overlay companion for Retinue"
build = "build.rs"

[dependencies]
bytes = "1"
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
memchr = "2.7"
retinue-client = { path = "../../crates/retinue-client" }
retinue-native = { path = "../../crates/retinue-native" }
retinue-ui = { path = "../../crates/retinue-ui" }
retinue-warframe = { path = "../../crates/retinue-warframe" }
rustix = { version = "1", features = ["fs", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
wayland-client = "0.31"
x11rb = "0.13"
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "tokio"] }
