[package]
name = "poe2companion"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Read-only Linux/Proton Path of Exile 2 native observer for Retinue"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
retinue-client = { path = "../../crates/retinue-client" }
retinue-poe2 = { path = "../../crates/retinue-poe2" }
retinue-overlay = { path = "../../crates/retinue-overlay" }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
