[package]
name = "arccompanion"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "ARC Raiders launch scaffold for Retinue"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
retinue-client = { path = "../../crates/retinue-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"
