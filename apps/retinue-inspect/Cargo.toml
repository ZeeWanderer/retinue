[package]
name = "retinue-inspect"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Retinue process, capture and game inspection CLI"

[dependencies]
retinue-poe2 = { path = "../../crates/retinue-poe2" }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
retinue-client = { path = "../../crates/retinue-client" }
retinue-native = { path = "../../crates/retinue-native" }
retinue-warframe = { path = "../../crates/retinue-warframe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
