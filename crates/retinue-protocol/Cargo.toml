[package]
name = "retinue-protocol"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Generated Retinue native transport and game-view contracts"

[dependencies]
bytes = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"
prost-types = "0.14"
