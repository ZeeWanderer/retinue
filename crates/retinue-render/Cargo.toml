[package]
name = "retinue-render"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Retained 2D drawing, raster resources and Blend2D execution"

[features]
benchmark = []

[dependencies]
crossbeam-deque = "0.8.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = { version = "0.19", default-features = false }
linebender_resource_handle = "0.1.1"
rustc-hash = "2.1.3"
read-fonts = "0.46.0"
rayon = "1.12"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
rayon = "1.12"
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
