[package]
name = "retinue-render"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Retained 2D drawing, raster resources and Blend2D execution"

[features]
benchmark = ["dep:rayon"]

[dependencies]
fontdue = "0.9.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = { version = "0.19", default-features = false }
rustc-hash = "2.1.3"
rayon = { version = "1.12", optional = true }
sha2 = "0.10"
tempfile = "3"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"

[dev-dependencies]
rayon = "1.12"
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
