[package]
name = "retinue-ui"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared native rendering, layout, input and window hosts"

[features]
default = ["overlay"]
overlay = ["dep:ashpd", "dep:futures-util", "dep:smithay-client-toolkit", "dep:tokio", "dep:wayland-client", "dep:x11rb"]
desktop = ["dep:accesskit", "dep:accesskit_winit", "dep:arboard", "dep:bytemuck", "dep:softbuffer", "dep:winit"]
benchmark = ["overlay", "dep:rustix", "dep:serde", "dep:wayland-protocols"]

[dependencies]
accesskit = { version = "0.25.1", optional = true }
accesskit_winit = { version = "0.34.1", optional = true }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"], optional = true }
bytemuck = { version = "1", optional = true }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
fontdue = "0.9.3"
futures-util = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = { version = "0.19", default-features = false }
rustix = { version = "1", features = ["time"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
tempfile = "3"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"], optional = true }
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"], optional = true }
taffy = { version = "0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client"], optional = true }
winit = { version = "0.30.13", optional = true }
x11rb = { version = "0.13", features = ["xtest", "xfixes"], optional = true }

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
