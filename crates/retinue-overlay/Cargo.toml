[package]
name = "retinue-overlay"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Shared native overlay rendering, layout and input"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
fontdue = "0.9.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
taffy = { version = "0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
wayland-client = "0.31"
x11rb = { version = "0.13", features = ["xtest", "xfixes"] }

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
